<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Perfume Crest Floral Wreath & Crown Scentiva Emblem -->
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9B7D8" />
      <stop offset="50%" stop-color="#F2D2E7" />
      <stop offset="100%" stop-color="#C7A66A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#451333" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Crown on Top -->
  <g filter="url(#softGlow)" fill="#F2D2E7" stroke="#451333" stroke-width="1.5">
    <path d="M75 52 C75 52, 85 45, 95 48 C98 38, 102 38, 105 48 C115 45, 125 52, 125 52 C125 52, 118 64, 100 64 C82 64, 75 52, 75 52 Z" fill="#E9B7D8" />
    <circle cx="100" cy="38" r="4.5" fill="#C7A66A" stroke="#451333" stroke-width="1" />
    <circle cx="85" cy="44" r="3.5" fill="#C7A66A" stroke="#451333" stroke-width="1" />
    <circle cx="115" cy="44" r="3.5" fill="#C7A66A" stroke="#451333" stroke-width="1" />
  </g>

  <!-- Laurel / Botanical Leaf Wreath (Left & Right) -->
  <g fill="#E9B7D8" stroke="#451333" stroke-width="1.2">
    <!-- Left Leaves -->
    <path d="M58 80 C40 85, 30 102, 38 118 C30 114, 25 125, 34 138 C26 138, 26 152, 40 162 C34 168, 38 182, 52 188 C48 198, 62 208, 80 214 C70 205, 68 192, 70 180" fill="#F2D2E7" />
    <!-- Right Leaves -->
    <path d="M142 80 C160 85, 170 102, 162 118 C170 114, 175 125, 166 138 C174 138, 174 152, 160 162 C166 168, 162 182, 148 188 C152 198, 138 208, 120 214 C130 205, 132 192, 130 180" fill="#F2D2E7" />
    <!-- Left Flowers -->
    <circle cx="58" cy="85" r="7" fill="#E9B7D8" />
    <circle cx="58" cy="85" r="2.5" fill="#451333" />
    <circle cx="142" cy="85" r="7" fill="#E9B7D8" />
    <circle cx="142" cy="85" r="2.5" fill="#451333" />
  </g>

  <!-- Ornate Perfume Flacon Body -->
  <g filter="url(#softGlow)">
    <path d="M68 85 L132 85 L124 185 L76 185 Z" fill="#FAEAF4" stroke="#451333" stroke-width="2.5" />
    <!-- Neck / Collar -->
    <rect x="88" y="64" width="24" height="21" rx="3" fill="#E9B7D8" stroke="#451333" stroke-width="2" />
    <line x1="88" y1="71" x2="112" y2="71" stroke="#451333" stroke-width="1.5" />
    <line x1="88" y1="78" x2="112" y2="78" stroke="#451333" stroke-width="1.5" />
    
    <!-- Botanical Etchings on Bottle -->
    <path d="M74 95 C82 105, 78 120, 72 130 C80 135, 76 150, 74 165" stroke="#B85B88" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M126 95 C118 105, 122 120, 128 130 C120 135, 124 150, 126 165" stroke="#B85B88" stroke-width="1.5" stroke-linecap="round" fill="none" />
    
    <!-- Central Plaque Frame -->
    <rect x="80" y="102" width="40" height="58" rx="4" fill="#FFFFFF" stroke="#451333" stroke-width="2" />
    <rect x="83" y="105" width="34" height="52" rx="2" fill="#FAF8F7" stroke="#E9B7D8" stroke-width="1" />

    <!-- Royal Monogram Letter 'S' -->
    <text x="100" y="141" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" fill="#321027" text-anchor="middle">S</text>
  </g>
</svg>
