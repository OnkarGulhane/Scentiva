spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:scentiva_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.scentiva: DEBUG

scentiva:
  mail:
    provider: mock
    enabled: true

