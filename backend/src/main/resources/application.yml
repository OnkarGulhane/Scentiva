spring:
  application:
    name: scentiva-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    default-property-inclusion: non_null
    time-zone: Asia/Kolkata
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
          batch_size: 25
        order_inserts: true
        order_updates: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    enabled: true
  show-actuator: true

scentiva:
  app:
    name: "SCENTIVA — Haute Parfumerie"
    version: "1.0.0-RELEASE"
    base-url: ${APP_BASE_URL:http://localhost:8080}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:scentiva-master-secret-key-2026-luxury-perfumery-enterprise-jwt-token-key-minimum-512-bits-long-signature}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 Days
      cookie-name: "scentiva_access_token"
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:3000}
      - "http://127.0.0.1:3000"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600
