spring:
  application:
    name: scentiva-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    default-property-inclusion: non_null
    time-zone: Asia/Kolkata
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
          batch_size: 25
        order_inserts: true
        order_updates: true

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    enabled: true
  show-actuator: true

scentiva:
  app:
    name: "SCENTIVA — Haute Parfumerie"
    version: "1.0.0-RELEASE"
    base-url: ${APP_BASE_URL:http://localhost:8080}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:scentiva-master-secret-key-2026-luxury-perfumery-enterprise-jwt-token-key-minimum-512-bits-long-signature}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 Days
      cookie-name: "scentiva_access_token"
    google:
      client-id: ${GOOGLE_CLIENT_ID:scentiva-google-client-id}
      client-secret: ${GOOGLE_CLIENT_SECRET:scentiva-google-client-secret}
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:3000}
      - "http://127.0.0.1:3000"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_TkFZU8ecNzFnCq}
    key-secret: ${RAZORPAY_KEY_SECRET:Faa4K7iK16vfTXWf1bs6Wfmo}
    currency: "INR"
    company-name: "SCENTIVA Haute Parfumerie"
    theme-color: "#321027"
  mail:
    provider: ${MAIL_PROVIDER:resend} # Options: resend, gmail, mock, hybrid
    from-email: ${MAIL_FROM:SCENTIVA <onboarding@resend.dev>}
    reply-to: ${MAIL_REPLY_TO:concierge@scentiva.com}
    enabled: ${MAIL_ENABLED:true}
    resend:
      api-key: ${RESEND_API_KEY:placeholder_resend_api_key}
      api-url: ${RESEND_API_URL:https://api.resend.com/emails}
    gmail:
      host: ${GMAIL_SMTP_HOST:smtp.gmail.com}
      port: ${GMAIL_SMTP_PORT:587}
      username: ${GMAIL_USERNAME:orders.scentiva@gmail.com}
      password: ${GMAIL_APP_PASSWORD:placeholder_app_password}
      auth: true
      starttls-enable: true
      connection-timeout: 5000
      timeout: 5000
      write-timeout: 5000
  invoice:
    company-name: "SCENTIVA Haute Parfumerie Private Limited"
    brand-tagline: "Haute Parfumerie & Luxury Fragrance Atelier"
    registered-address: "Aura Prestige Towers, Level 4, Baner High Street, Pune, Maharashtra 411045, India"
    support-email: "concierge@scentiva.com"
    support-phone: "+91 20 4911 2026"
    website: "https://scentiva.luxury"
    tax-id: ${INVOICE_TAX_ID:27AALCS9812K1Z0} # GSTIN Placeholder (configured, non-invented)
    currency: "INR"
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    enabled: ${AI_SERVICE_ENABLED:true}
    timeout-ms: ${AI_TIMEOUT_MS:10000}
